FUNC void dump (void) {
  int i;
  printf("traceN=%d\n", traceN);
  for (i = 0; i < traceN; i++) printf("%c %d\n", traceWho[i], traceT_ms[i]);
  printf("jobs %d %d %d\n", jobs[0], jobs[1], jobs[2]);
  printf("miss %d %d %d\n", misses[0], misses[1], misses[2]);
  printf("worst %d %d %d\n", worstResp_ms[0], worstResp_ms[1], worstResp_ms[2]);
  printf("last %d %d %d\n", lastResp_ms[0], lastResp_ms[1], lastResp_ms[2]);
}
SIGNAL void stopper (void) {
  twatch (460000000);
  dump();
  printf("END_OF_CHECK\n");
  exec("LOG OFF");
}
LOG > sim_log.txt
stopper()
G
