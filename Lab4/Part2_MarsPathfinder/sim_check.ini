FUNC void dump (void) {
  int i;
  printf("traceN=%d\n", traceN);
  for (i = 0; i < traceN; i++) printf("%c %d\n", traceWho[i], traceT_ms[i]);
  printf("finish A=%d B=%d C=%d\n", finish_ms[0], finish_ms[1], finish_ms[2]);
  printf("r1_inUse=%d r1_owner=%c A_polls=%d C_r1Done_ms=%d running=%c\n", r1_inUse, r1_owner, A_polls, C_r1Done_ms, running);
}
SIGNAL void stopper (void) {
  twatch (25000000);
  dump();
  printf("END_OF_CHECK\n");
  exec("LOG OFF");
}
LOG > sim_log.txt
stopper()
G
